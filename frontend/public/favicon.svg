<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#07090e" />
  <polygon points="50,12 88,32 88,68 50,88 12,68 12,32" fill="none" stroke="url(#grad)" stroke-width="4" filter="url(#glow)"/>
  <text x="50" y="60" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="34" text-anchor="middle" letter-spacing="-1">VP</text>
</svg>
